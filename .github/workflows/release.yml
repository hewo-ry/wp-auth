name: Create new release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: hewo-wp-auth/vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      working-directory: hewo-wp-auth
      run: composer install --no-dev --no-progress --optimize-autoloader

    - name: Build package
      run: |
        mkdir -p build/hewo-wp-auth
        cp hewo-wp-auth/*.php build/hewo-wp-auth/
        cp -r hewo-wp-auth/vendor build/hewo-wp-auth/

        cd build/
        zip -r ../hewo-wp-auth.zip hewo-wp-auth/

    - name: Create release
      uses: softprops/action-gh-release@v3
      with:
        files: hewo-wp-auth.zip
        fail_on_unmatched_files: true
