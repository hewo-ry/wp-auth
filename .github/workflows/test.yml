---
name: Run tests

on:
  pull_request:
    branches:
      - main

jobs:
  phpunit:
    runs-on: ubuntu-26.04

    concurrency:
      group: test
      cancel-in-progress: true

    services:
      mariadb:
        image: mariadb:12.3.3
        env:
          MARIADB_RANDOM_ROOT_PASSWORD: 1
          MARIADB_USER: wp-test
          MARIADB_PASSWORD: yNWRI8HmfiTnnBXoZZizrNu92UNr3sTc
          MARIADB_DATABASE: wp-test
        ports:
          - 3306:3306

    strategy:
      matrix:
        php:
          - '8.5'
        worpress:
          - 7.1.3

    defaults:
      run:
        working-directory: hewo-wp-auth

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}

      - name: Install svn
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist

      - name: Setup tests
        run: bin/install-wp-tests.sh wp-test wp-test yNWRI8HmfiTnnBXoZZizrNu92UNr3sTc 127.0.0.1 ${{ matrix.worpress }} true

      - name: Run tests
        run: vendor/bin/phpunit
